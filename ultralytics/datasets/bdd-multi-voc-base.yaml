# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path:  /home/ubuntu/data/base # dataset root dir

# Train/val/test image paths for all tasks
train: images/train2017  # train images for object detection (relative to 'path')


val: images/val2017  # val images for object detection (relative to 'path')


test: images/val2017  # test images for object detection (relative to 'path')

labels_list:
  - detection-object
  - seg-drivable-10
  - seg-lane-11

tnc: 7  # number of classes
nc_list: [5,1,1]
map: [None, {'5':'0'},{'6':'0'}]

# Classes for all tasks
names:
  0: vehicle
  1: person
  2: traffic light
  3: traffic sign
  4: automobile
  5: drivable  # Add drivable class for drivable segmentation
  6: lane
